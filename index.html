<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8F3B05">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vistoria">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vistoria de Entrega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<script src="jspdf.umd.min.js"></script>
<style>
/* Layout: uma coluna de fichas empilhadas (estilo prancheta de obra), ambientes e subtemas em sanfona, barra fixa no rodapé para o PDF */
:root{
  --bg:#F2EFEC; --surface:#FFFFFF; --surface-2:#F8F6F4; --ink:#1F1A17; --muted:#6B625B; --line:#DDD6D0;
  --accent:#C4540A; --accent-ink:#FFFFFF; --accent-soft:#FBE5D3; --brand-deep:#8F3B05;
  --ok:#1C7443; --ok-bg:#DCF0E3; --bad:#AE2A21; --bad-bg:#F8DFDC; --na:#5F686C; --na-bg:#E3E7E8;
  --warn:#8A5A00;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16120F; --surface:#201A16; --surface-2:#28211C; --ink:#EEE8E3; --muted:#A89C93; --line:#3A302A;
  --accent:#FF8F3D; --accent-ink:#1F0F04; --accent-soft:#45260F; --brand-deep:#B8530F;
  --ok:#62C98E; --ok-bg:#173524; --bad:#F08B81; --bad-bg:#3E1D1A; --na:#A0AAAE; --na-bg:#263135; --warn:#E3B45A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16120F; --surface:#201A16; --surface-2:#28211C; --ink:#EEE8E3; --muted:#A89C93; --line:#3A302A;
  --accent:#FF8F3D; --accent-ink:#1F0F04; --accent-soft:#45260F; --brand-deep:#B8530F;
  --ok:#62C98E; --ok-bg:#173524; --bad:#F08B81; --bad-bg:#3E1D1A; --na:#A0AAAE; --na-bg:#263135; --warn:#E3B45A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand-deep)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink)}
.top-in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;align-items:center;gap:12px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.saved{font-size:.78rem;opacity:.85;white-space:nowrap}
.brand{background:var(--brand-deep);color:#FFF;text-align:center;font-family:var(--f-display);font-weight:700;font-size:.78rem;letter-spacing:.18em;padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.drivetop{display:inline-flex;align-items:center;gap:4px;font:inherit;font-weight:700;font-size:.85rem;padding:6px 9px;border-radius:8px;border:1.5px solid var(--accent-ink);background:transparent;color:var(--accent-ink);cursor:pointer;flex:none}
.drivetop svg{width:20px;height:20px}
.drivetop{position:relative}
.drivetop.bad span{position:absolute;top:-8px;right:-8px;background:#B3261E;color:#fff;border-radius:99px;min-width:20px;height:20px;padding:0 5px;font-size:.72rem;display:grid;place-items:center;border:2px solid var(--accent)}
.drivetop.ok{background:var(--accent-ink);color:var(--ok)}
@media (max-width:430px){.saved{display:none}}
.savebtn{font:inherit;font-weight:700;font-size:.92rem;padding:7px 14px;border-radius:8px;border:0;background:var(--accent-ink);color:var(--accent);cursor:pointer;flex:none}
.iconbtn{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;font:inherit;font-size:.9rem;cursor:pointer}
h2{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=number],input[type=url],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:12px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:8px 12px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* home list */
.vlist{display:flex;flex-direction:column;gap:10px}
.vcard{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.vcard .t{flex:1;min-width:0}
.vcard b{font-family:var(--f-display);font-size:1.15rem;display:block}
.vcard small{color:var(--muted);display:block}
.pill{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.03em;text-transform:uppercase}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.na{background:var(--na-bg);color:var(--na)}
.vwrap{display:flex;flex-direction:column}
.vwrap .vcard{background:none;border:0}
.vacts{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
.act{font:inherit;font-size:.86rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--accent);cursor:pointer}
.act.del{color:var(--bad)}
.act svg{width:18px;height:18px}
.mailbox{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px;border-top:1px dashed var(--line);padding-top:12px}
.mailbox input[type=email]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.mailbox[hidden],.addamb[hidden]{display:none}
.mailmsg{font-size:.88rem;color:var(--accent)}
.drag{display:inline-grid;place-items:center;width:30px;height:36px;margin:-6px 0 -6px -8px;color:var(--muted);touch-action:none;cursor:grab;flex:none}
.sorting .amb>.acc-b{display:none!important}
.amb.dragging{outline:3px solid var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.18);position:relative;z-index:2}
.filters{display:flex;flex-direction:column;gap:8px}
.filters .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters .chip{white-space:nowrap;flex:none}
.chip.small{font-size:.84rem;padding:6px 10px}
.mgroup{display:flex;flex-direction:column;gap:8px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-weight:700;font-size:1.1rem;letter-spacing:.03em;padding-top:6px;border-bottom:2px solid var(--accent);padding-bottom:4px;color:var(--accent)}
.mhead .cnt{font-family:var(--f-body);font-weight:500;font-size:.82rem;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.92rem;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .x{opacity:.7}
/* sanfonas */
.acc>.acc-h{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;background:none;border:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.acc-h .nm{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.02em}
.acc-h .cnt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.acc-h .chev{transition:transform .15s;color:var(--muted)}
.acc.open>.acc-h .chev{transform:rotate(90deg)}
.acc>.acc-b{display:none;border-top:1px solid var(--line)}
.acc.open>.acc-b{display:block}
.amb>.acc-b{padding:12px;display:none;flex-direction:column;gap:10px}
.amb.open>.acc-b{display:flex}
.sub{background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.sub>.acc-h{padding:12px 14px}
.sub>.acc-h .nm{font-size:1.02rem;text-transform:uppercase;letter-spacing:.05em}
.sub>.acc-b{padding:4px 14px 14px}
.subtoggles{display:flex;flex-direction:column;gap:6px}
.subtoggles small{color:var(--muted)}
/* check verdinho */
.tick{width:24px;height:24px;border-radius:50%;flex:none;display:inline-grid;place-items:center;border:2px solid var(--line);color:transparent}
.tick.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tick svg{width:14px;height:14px}
/* itens */
.item{padding:14px 0;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.item:last-child{border-bottom:0}
.item-h{display:flex;gap:10px;align-items:flex-start}
.item-h .q{flex:1;min-width:0;font-weight:600}
.hint{font-size:.85rem;color:var(--muted);margin-top:-4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;font-size:.92rem;font-weight:500;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:42px}
.opt[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.okv[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.badv[aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.nav[aria-pressed=true]{background:var(--na);border-color:var(--na);color:var(--surface)}
.obs-l{font-size:.82rem;color:var(--muted);font-weight:500}
.obs-l.req{color:var(--warn)}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.thumb{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;border:0;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font:inherit;font-size:.72rem;padding:3px 6px;cursor:pointer}
.photo-btn{font:inherit;font-size:.88rem;display:inline-flex;gap:6px;align-items:center;padding:8px 12px;border-radius:8px;border:1px dashed var(--accent);color:var(--accent);background:transparent;cursor:pointer}
.photo-btn svg{width:18px;height:18px}
.photo-btn.need{border-style:solid;background:var(--accent-soft)}
.testb{display:inline-flex;align-items:center;gap:4px;margin-right:8px;padding:2px 8px 2px 4px;border-radius:99px;background:var(--bad-bg);color:var(--bad);font-size:.7rem;font-weight:700;letter-spacing:.06em;vertical-align:2px}
.testb svg{width:16px;height:16px}
.vids{display:flex;flex-direction:column;gap:8px}
.vthumb{display:flex;flex-direction:column;gap:6px;max-width:320px}
.vthumb video{width:100%;max-width:100%;border-radius:8px;background:#000;max-height:220px}
.photo-btn.vid{border-color:var(--bad);color:var(--bad)}
.photo-btn.vid.need{border-style:solid;background:var(--bad-bg)}
.mchk{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:700;letter-spacing:.03em;padding:3px 7px;border-radius:6px;flex:none;white-space:nowrap;border:1.5px solid currentColor}
.mchk svg,.mtag svg{width:13px;height:13px}
.mchk[hidden],.mline[hidden]{display:none!important}
.mchk.ok{color:var(--ok);background:var(--ok-bg)}.mchk.bad{color:var(--bad);background:var(--bad-bg)}
.mline{font-size:.82rem;border-radius:8px;padding:6px 10px;margin-top:-2px}.mline.ok{background:var(--ok-bg);color:var(--ok)}.mline.bad{background:var(--bad-bg);color:var(--bad)}
.mtag{display:inline-flex;align-items:center;gap:6px;margin-top:6px}.mtag.bad{color:var(--bad)}
.mgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}.mgrid b{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.mgrid span{font-size:.92rem}.mgrid input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.memog{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.memoh{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px}
.hint.calc{color:var(--ink);background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-top:0;font-weight:500}
.dd{position:relative;display:flex;flex-direction:column;gap:8px}
.dd-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:1rem;padding:12px 14px;border-radius:10px;border:1.5px solid var(--accent);background:var(--surface-2);color:var(--ink);cursor:pointer}
.dd-btn span{flex:1;min-width:0}
.dd-btn svg{color:var(--accent);flex:none;transition:transform .15s}
.dd-btn[aria-expanded=true] svg{transform:rotate(180deg)}
.dd-panel{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 12px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 22px rgba(0,0,0,.12)}
.dd-panel[hidden]{display:none}
.dd-x{align-self:flex-end;font:inherit;font-weight:600;font-size:.9rem;color:var(--accent);background:none;border:0;padding:8px 4px;cursor:pointer}
.dd-done{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.dd-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:1rem;cursor:pointer}
.dd-row input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.remind{display:flex;gap:10px;align-items:flex-start;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:12px}
.remind svg{width:22px;height:22px;flex:none}
.remind span{color:var(--ink)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,12,6,.55);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.modal[hidden]{display:none}
.modal-card{background:var(--surface);color:var(--ink);border-radius:14px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 50px rgba(0,0,0,.3);border-top:5px solid var(--bad)}
.modal-card h3{margin:0;font-family:var(--f-display);font-size:1.25rem;color:var(--bad)}
.modal-card p{margin:0}.modal-card ul{margin:0;padding-left:20px;color:var(--bad);font-weight:600}
label.f.missing{color:var(--bad)}
label.f.missing{position:relative}
label.f.missing::before{content:"*";position:absolute;left:-11px;top:-2px;color:var(--bad);font-weight:700;font-size:1.1rem}
label.f.missing input{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.verbox{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--muted)}
.skipnote{font-size:.88rem;color:var(--muted);padding:10px 0}
/* resultado */
.res-seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res-seg .opt{font-family:var(--f-display);font-size:1.15rem;font-weight:700;letter-spacing:.04em;padding:16px;text-transform:uppercase}
.pend{font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.pend li{color:var(--bad)}
.pend ul{margin:0;padding-left:18px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;display:flex;gap:10px;align-items:center}
.foot-in .prog{flex:1;min-width:0;font-size:.85rem;color:var(--muted)}
.bar-p{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}
.bar-p i{display:block;height:100%;background:var(--ok);width:0}
.umid-btn{display:flex;align-items:center;gap:8px;width:100%;font:inherit;font-weight:600;text-align:left;padding:12px 14px;border-radius:10px;border:2px solid var(--bad);background:var(--bad-bg);color:var(--bad);cursor:pointer}
.umid-btn svg.th{width:22px;height:22px;flex:none}
.umid-btn .lbl{flex:1;min-width:0}
.umid-btn small{display:block;font-weight:400;color:var(--ink);opacity:.8}
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .top{top:0;padding-top:env(safe-area-inset-top,0px)}
.ponto{display:flex;flex-direction:column;gap:12px}
.ponto-h{display:flex;align-items:center;gap:10px}
.ponto-h b{flex:1;font-family:var(--f-display);font-size:1.2rem;letter-spacing:.03em;text-transform:uppercase;color:var(--bad)}
.area{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.area-h{display:flex;align-items:center;gap:8px;font-weight:600}
.area-h>span:first-child{flex:1}
.area.seca .area-h>span:first-child{color:var(--accent)}
.area.molh .area-h>span:first-child{color:var(--bad)}
.valrow{display:flex;gap:8px;align-items:center}
.valrow input{max-width:180px}
.footph{display:inline-flex;align-items:center;gap:6px;padding:10px 12px;color:var(--accent)}
.footph svg{width:20px;height:20px}
.footph{position:relative;display:inline-flex;align-items:center;gap:4px;font:inherit;font-weight:700;padding:9px 12px;border-radius:10px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;flex:none}
.footph svg{width:30px;height:24px}
.footph .dot{position:absolute;top:-7px;right:-7px;background:#B3261E;color:#fff;border-radius:99px;min-width:20px;height:20px;padding:0 5px;font-size:.72rem;display:grid;place-items:center;border:2px solid var(--surface)}
.footph .okm{color:var(--ok);font-size:.9rem}
.footph.ok{border-color:var(--ok);color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;z-index:40;max-width:90vw;text-align:center}
.note{font-size:.85rem;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.addamb{display:flex;gap:8px}
.addamb input{flex:1;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<header class="top"><div class="brand">TITÁ SOLUÇÕES DE ENGENHARIA</div><div class="top-in">

function obsRequired(item,val){if(item.type!=='check'||!val||!val.v)return false;if(val.v==='Não se aplica')return false;return item.obs==='always'||(item.obs==='ifNo'&&val.v===(item.bad||'Não aprovado'))}
function itemDone(item,val){
  if(!val)return false;
  if(item.type==='photo')return (val.fotos||[]).length>0;
  if(item.type==='text')return !!(val.txt||'').trim();
  if(item.type==='number')return val.v!==undefined&&val.v!==null&&String(val.v).trim()!=='';
  if(!val.v)return false;
  if(item.other&&val.v===item.other&&!(val.txt||'').trim())return false;
  if(obsRequired(item,val)&&!(val.obs||'').trim())return false;
  if(item.textField&&item.textField.required&&!(val.txt||'').trim())return false;
  if(item.umidTest&&val.v==='Não aprovado'&&!umidDone(val))return false;

}

      if(busyHome)return;busyHome=true;b.textContent='Gerando…';try{const r=await withVistoria(b.dataset.hshare,async()=>{const {blob,name}=buildPDF();return {files:[new File([blob],name,{type:'application/pdf'})],title:name}});
        const ok=await shareFiles(r.files,r.title,true);if(ok==='retry'){pendingShare={id:b.dataset.hshare,...r};b.innerHTML=ICO_MAIL+'PDF pronto: toque para compartilhar';busyHome=false;return}}catch(err){toast('Erro ao gerar o PDF.')}b.innerHTML=ICO_MAIL+'Compartilhar';busyHome=false;return}
    if(b.id==='bkExport'){exportBackup();return}
    if(b.id==='updBtn'){updateApp(b);return}
    if(b.id==='bkImport'){$('#bkInput').value='';$('#bkInput').click();return}
    if(b.dataset.hdel){if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.innerHTML=ICO_DEL+'Toque de novo para excluir';setTimeout(()=>{if(b.isConnected){b.dataset.confirm='';b.innerHTML=ICO_DEL+'Excluir'}},4000);return}
      const v=normalize(await dbGet('vistorias',b.dataset.hdel));if(v){const ids=[];for(const a of v.ambientes)for(const k in a.subs)for(const i in a.subs[k].vals){const vv=a.subs[k].vals[i];(vv.fotos||[]).concat(vv.videos||[],umidPhotoIds(vv)).forEach(f=>ids.push(f))}
        for(const f of ids){await dbDel('fotos',f);photoCache.delete(f);videoCache.delete(f)}await dbDel('vistorias',v.id)}toast('Vistoria excluída');showHome();return}
  };
  app.oninput=null;
}
async function openVistoria(id){if(!(await loadVistoria(id)))return showHome();openSet.clear();showEditor()}
async function loadVistoria(id){V=normalize(await dbGet('vistorias',id));if(!V)return false;
  const ids=[];for(const a of V.ambientes)for(const s of subsOf(a))for(const k in a.subs[s.id].vals)(a.subs[s.id].vals[k].fotos||[]).forEach(f=>ids.push(f));
  await Promise.all(ids.map(async f=>{if(!photoCache.has(f)){const p=await dbGet('fotos',f);if(p)photoCache.set(f,p)}}));
  const vids=[];for(const a of V.ambientes)for(const s of subsOf(a))for(const k in a.subs[s.id].vals)(a.subs[s.id].vals[k].videos||[]).forEach(f=>vids.push(f));
  const uids=[];for(const a of V.ambientes)for(const s of subsOf(a))for(const k in a.subs[s.id].vals)umidPhotoIds(a.subs[s.id].vals[k]).forEach(f=>uids.push(f));
  await Promise.all(uids.map(async f=>{if(!photoCache.has(f)){const p=await dbGet('fotos',f);if(p)photoCache.set(f,p)}}));
  await Promise.all(vids.map(async f=>{if(!videoCache.has(f)){const r=await dbGet('fotos',f);if(r&&r.blob)videoCache.set(f,{...r,url:URL.createObjectURL(r.blob)})}}));
  return true}

function subHTML(a,s){

function subBodyHTML(a,s){
  const vals=a.subs[s.id].vals;const vis=visibleItems(s,vals);

  return h;
}
function itemHTML(a,s,it){
  const val=a.subs[s.id].vals[it.id]||{};const path=`${a.id}|${s.id}|${it.id}`;const fid=path.replace(/\|/g,'-');
  let ctrl='';
  if(it.type==='text'){ctrl=`<input type="text" id="x-${fid}" data-txt="${path}" value="${esc(val.txt||'')}" placeholder="Digite">`}
  else if(it.type==='number'){ctrl=`<input type="number" inputmode="numeric" min="0" id="n-${fid}" data-num="${path}" value="${esc(val.v??'')}" style="max-width:160px">`}
  else if(it.options){ctrl=`<div class="seg">${it.options.map(o=>{const cls=o==='Não se aplica'?'nav':it.type!=='check'?'':o===(it.bad||'Não aprovado')?'badv':'okv';return `<button class="opt ${cls}" data-opt="${path}" data-v="${esc(o)}" aria-pressed="${val.v===o}">${esc(o)}</button>`}).join('')}</div>`;
    if(it.other&&val.v===it.other)ctrl+=`<input type="text" id="o-${fid}" data-txt="${path}" placeholder="Qual?" value="${esc(val.txt||'')}">`;}
  if(it.type==='photo')ctrl='';
  if(it.textField)ctrl+=`<label class="f"><span class="obs-l">${esc(it.textField.label)}${it.textField.required?' (obrigatório)':''}</span><input type="text" id="x-${fid}" data-txt="${path}" value="${esc(val.txt||'')}"></label>`;
  if(it.umidTest&&val.v==='Não aprovado')ctrl+=umidBtnHTML(path,val);
  let obs='';
  if(it.type==='check'&&val.v!=='Não se aplica'){
    const req=obsRequired(it,val);const lbl=!val.v?(it.obs==='always'?'Observações (obrigatório)':'Observações (obrigatório se não aprovado)'):req?'Observações (obrigatório)':'Observações (opcional)';
    obs=`<label class="f"><span class="obs-l ${req&&!(val.obs||'').trim()?'req':''}" data-obsl="${path}">${lbl}</span><textarea id="t-${fid}" data-obs="${path}" rows="2">${esc(val.obs||'')}</textarea></label>`;
  }
  const fotos=(val.fotos||[]);
  const full=fotos.length>=MAX_FOTOS;
  const ph=it.nophoto?'':`<div class="photos">${fotos.map(f=>{const p=photoCache.get(f);return p?`<div class="thumb"><img src="${p.data}" alt="Foto"><button data-delphoto="${path}|${f}">✕</button></div>`:''}).join('')}
    ${full?`<span class="hint" style="margin:0">Limite de ${MAX_FOTOS} fotos atingido</span>`:`<button class="photo-btn ${it.photo&&!fotos.length?'need':''}" data-cam="${path}">${CAM}Foto</button>
    <button class="photo-btn" data-gal="${path}">Galeria</button><span class="hint" style="margin:0">${fotos.length}/${MAX_FOTOS}</span>`}</div>`;
  const vids=val.videos||[];
  const vh=!it.test?'':`<div class="vids">${vids.map(id=>{const vv=videoCache.get(id);return vv?`<div class="vthumb"><video src="${vv.url}" controls playsinline preload="metadata"></video><div class="row">${BUILD==='site'?((V.fotosSalvas||{})[id]?'<span class="pill ok">Salvo no celular</span>':'<span class="pill bad">Não salvo no celular</span>')+(GCLIENT_ID&&V.drive&&V.drive.videos&&V.drive.videos[id]?'<span class="pill ok">No Drive</span>':''):(V.drive&&V.drive.videos&&V.drive.videos[id]?'<span class="pill ok">No Drive</span>':'<span class="pill na">Só no aparelho</span>')}<button class="btn small" data-dlvid="${id}">Baixar</button><button class="btn small danger" data-delvid="${path}|${id}">Remover</button></div></div>`:''}).join('')}
    ${vids.length>=MAX_VIDEOS?`<span class="hint" style="margin:0">Limite de ${MAX_VIDEOS} vídeos atingido</span>`:`${(it.videoReq||(it.videoReqNo&&val.v===(it.bad||'Não aprovado')))&&vids.length<(it.videoMin||1)?`<span class="obs-l req">${(it.videoMin||1)>1?`Grave ${it.videoMin} vídeos do teste (obrigatório)`:'Vídeo do teste obrigatório'}</span>`:''}<div class="row"><button class="photo-btn vid ${(it.videoReq||(it.videoReqNo&&val.v===(it.bad||'Não aprovado')))&&vids.length<(it.videoMin||1)?'need':''}" data-vid="${path}">${VID}Gravar vídeo</button><button class="photo-btn vid" data-vidgal="${path}">Vídeo da galeria</button><span class="hint" style="margin:0">${vids.length}/${MAX_VIDEOS}</span></div>`}</div>`;
  return `<div class="item" data-item="${path}">
    <div class="item-h"><span class="q">${it.test?TESTBADGE:''}${esc(it.label)}</span><span class="mchk" data-mchk="${path}" hidden></span><span class="tick" data-tk-item="${path}">${CHECK}</span></div>
    <div class="mline" data-mline="${path}" hidden></div>
    ${(it.hintFn?it.hintFn():it.hint)?`<div class="hint${it.hintFn?' calc':''}">${esc(it.hintFn?it.hintFn():it.hint)}</div>`:''}${ctrl}${obs}${ph}${vh}</div>`;
}

function setTick(el,on){if(el)el.classList.toggle('done',!!on)}
function refreshStatus(){
  setTick($('#tk-dados'),dadosDone());
  {const ms=memoStats();const mc=$('#memoCnt');if(mc)mc.textContent=`${ms.d}/${ms.t}`;setTick($('#tk-memo'),ms.d===ms.t)}
  for(const a of V.ambientes){if(!a.ativo)continue;
    const as=ambStats(a);const c=document.querySelector(`[data-cnt-amb="${a.id}"]`);if(c)c.textContent=`${as.done}/${as.total}`;
    setTick(document.querySelector(`[data-tk-amb="${a.id}"]`),as.total>0&&as.done===as.total);
    for(const s of subsOf(a)){if(!a.subs[s.id].on)continue;const st=subStats(a,s.id);const k=a.id+'|'+s.id;
      const cc=document.querySelector(`[data-cnt-sub="${k}"]`);if(cc)cc.textContent=`${st.done}/${st.total}`;
      setTick(document.querySelector(`[data-tk-sub="${k}"]`),st.done===st.total);
      for(const it of visibleItems(s,a.subs[s.id].vals)){const val=a.subs[s.id].vals[it.id];const p=k+'|'+it.id;
        setTick(document.querySelector(`[data-tk-item="${p}"]`),itemDone(it,val));
        {const mc=document.querySelector(`[data-mchk="${p}"]`);if(mc){const c=memoCheck(a,s,it,val);const ml=document.querySelector(`[data-mline="${p}"]`);
          if(!c){mc.hidden=true;if(ml)ml.hidden=true}else{mc.hidden=false;mc.className='mchk '+(c.ok?'ok':'bad');mc.innerHTML=ICO_MEMO+(c.ok?'Memorial ✓':'Memorial ✗');mc.title=c.ok?'Confere com o memorial':'Diverge do memorial';
            if(ml){ml.hidden=false;ml.className='mline '+(c.ok?'ok':'bad');ml.textContent=`Memorial: ${c.memo} · Encontrado: ${c.found}`}}}}
        const ol=document.querySelector(`[data-obsl="${p}"]`);if(ol)ol.classList.toggle('req',obsRequired(it,val)&&!((val&&val.obs)||'').trim());}}}
  updateSaveBtns();
  {const dt=$('#divTag');if(dt)dt.innerHTML=divTagHTML()}
  updateDriveTop();

/* ============ ATUALIZAR APP ============ */
async function updateApp(btn){if(navigator.onLine===false){toast('Sem internet agora. Para atualizar, conecte e tente de novo.');return}
  btn.disabled=true;btn.textContent='Procurando…';
  try{const r=await fetch('./index.html?v='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/const APP_VERSION='([^']*)'/);const nova=m?m[1]:'';
    if(nova&&nova===APP_VERSION){toast('Você já está na versão mais nova ('+APP_VERSION+').',2600);btn.disabled=false;btn.textContent='Atualizar app';return}
    btn.textContent='Atualizando…';
    try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}catch(e){}
    try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
    toast(nova?'Atualizando para a versão '+nova+'…':'Atualizando…',1500);setTimeout(()=>location.reload(),900)}
  catch(e){toast('Não consegui buscar a versão nova. Verifique a internet.');btn.disabled=false;btn.textContent='Atualizar app'}}

  for(const f of files)await deliver(f,f.name);
  if(!(navigator.canShare))toast('Este navegador não compartilha arquivos. Os arquivos foram baixados.');

async function sendMail(id,btn){
  const box=document.querySelector(`[data-mailbox="${id}"]`);const msg=box.querySelector('[data-mailmsg]');const inp=box.querySelector('input');
  const to=inp.value.split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean);
  if(!to.length||!to.every(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x))){msg.textContent='Digite um e-mail válido.';inp.focus();return}
  const mcp=await getMcp();if(!mcp){msg.textContent='O envio por e-mail só funciona com o app aberto dentro do Claude e com internet.';return}
  if(navigator.onLine===false){msg.textContent='Sem internet agora. Envie quando tiver sinal.';return}
  if(busyHome)return;busyHome=true;btn.disabled=true;btn.textContent='Gerando PDF…';msg.textContent='';
  try{
    let fileArgs=false;try{fileArgs=!!(await mcp.listTools()).fileArgs}catch(e){}
    const out=await withVistoria(id,async()=>{const r=buildPDF();return {...r,d:{...V.dados},folder:V.drive&&V.drive.folderUrl,res:V.resultado}});
    let content;if(fileArgs)content={$file:{data:out.blob,name:out.name,type:'application/pdf'}};else if(out.blob.size<700000)content=await blobToB64(out.blob);else throw Object.assign(new Error(),{code:'too_big_inline'});
    btn.textContent='Enviando…';
    const d=out.d;const subject=`Laudo de vistoria de entrega · Apto ${d.apartamento||''} · ${d.empreendimento||''}`.trim();
    const body=`Olá,\n\nSegue em anexo o laudo de vistoria de entrega do apartamento ${d.apartamento||''}${d.empreendimento?' do empreendimento '+d.empreendimento:''}${d.cliente?', cliente '+d.cliente:''}, realizada em ${fmtDate(d.data)}.${out.res?'\n\nResultado: '+out.res+'.':''}${out.folder?'\n\nVídeos e arquivos da vistoria: '+out.folder:''}\n\nAtenciosamente.`;
    await mcp.callTool('Gmail','send_message',{to,subject,body,attachments:[{filename:out.name,mimeType:'application/pdf',content}]});
    try{localStorage.setItem('vist-last-email',inp.value.trim())}catch(e){}
    msg.textContent=`Enviado para ${to.join(', ')}.`;toast('E-mail enviado');
  }catch(e){msg.textContent=e&&e.code==='too_big_inline'?'O PDF ficou grande demais para enviar por este aparelho. Use o botão PDF e mande pelo seu e-mail.':connErr(e,'Gmail')}
  btn.disabled=false;btn.textContent='Enviar PDF';busyHome=false;
}

/* ============ GOOGLE DRIVE DIRETO (versão site) ============ */
let gTok=null,gClient=null,gAfterLogin=null;
function cachedTok(){if(gTok&&gTok.exp>Date.now()+60000)return gTok.token;try{const t=JSON.parse(localStorage.getItem('vist-gtok')||'null');if(t&&t.exp>Date.now()+60000){gTok=t;return t.token}}catch(e){}return null}
function clearTok(){gTok=null;try{localStorage.removeItem('vist-gtok')}catch(e){}}
function initGIS(){if(!GCLIENT_ID||gClient||navigator.onLine===false)return;if(window.google&&google.accounts&&google.accounts.oauth2){mkClient();return}
  if(document.getElementById('gis'))return;const sc=document.createElement('script');sc.id='gis';sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=mkClient;sc.onerror=()=>sc.remove();document.head.appendChild(sc)}
function mkClient(){try{gClient=google.accounts.oauth2.initTokenClient({client_id:GCLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',
  callback:r=>{const cb=gAfterLogin;gAfterLogin=null;if(r&&r.access_token){gTok={token:r.access_token,exp:Date.now()+(Number(r.expires_in)||3600)*1000};try{localStorage.setItem('vist-gtok',JSON.stringify(gTok))}catch(e){}if(cb)cb(true)}else{if(cb)cb(false)}},
  error_callback:()=>{const cb=gAfterLogin;gAfterLogin=null;if(cb)cb(false)}})}catch(e){gClient=null}}
/* precisa ser chamado direto no toque do botão */
function gLogin(then){if(cachedTok()){then(true);return}if(!gClient){initGIS();setDriveMsg('Conectando ao Google… toque de novo em alguns segundos.');return}gAfterLogin=then;gClient.requestAccessToken({prompt:''})}
async function gFetch(method,url,body,headers={}){const t=cachedTok();if(!t)throw Object.assign(new Error(),{code:'need_login'});
  const r=await fetch(url,{method,headers:{Authorization:'Bearer '+t,...headers},body});if(r.status===401){clearTok();throw Object.assign(new Error(),{code:'need_login'})}
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw Object.assign(new Error(m),{code:'http',status:r.status})}return r}
async function gCreateFolder(name,parent){const meta={name,mimeType:FOLDER};if(parent)meta.parents=[parent];return (await gFetch('POST','https://www.googleapis.com/drive/v3/files?fields=id,webViewLink',JSON.stringify(meta),{'Content-Type':'application/json'})).json()}
async function gUpload(blob,name,type,parent){const bd='vist'+Math.random().toString(36).slice(2);
  const body=new Blob([`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`,JSON.stringify({name,parents:[parent]}),`\r\n--${bd}\r\nContent-Type: ${type}\r\n\r\n`,blob,`\r\n--${bd}--`]);
  return (await gFetch('POST','https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',body,{'Content-Type':'multipart/related; boundary='+bd})).json()}
async function gShareAnyone(id){try{await gFetch('POST',`https://www.googleapis.com/drive/v3/files/${id}/permissions`,JSON.stringify({role:'reader',type:'anyone'}),{'Content-Type':'application/json'})}catch(e){if(e.code==='need_login')throw e}}
async function gEnsureFolder(){V.drive=V.drive||{};V.drive.videos=V.drive.videos||{};if(V.drive.folderId&&V.drive.g)return;
  let root=null;try{root=localStorage.getItem('vist-groot')}catch(e){}
  const d=V.dados;const title=`Apto ${d.apartamento||'sem número'} - ${d.cliente||'Cliente'} - ${fmtDate(d.data).replace(/\//g,'-')}`;
  let f;try{if(!root)throw 0;f=await gCreateFolder(title,root)}catch(e){if(e&&e.code==='need_login')throw e;const r=await gCreateFolder('Vistorias de Entrega');root=r.id;try{localStorage.setItem('vist-groot',root)}catch(_){}f=await gCreateFolder(title,root)}
  await gShareAnyone(f.id);V.drive.folderId=f.id;V.drive.folderUrl=f.webViewLink||`https://drive.google.com/drive/folders/${f.id}`;V.drive.g=true;V.drive.videos={};await saveNow()}
async function gSyncVideos(progress=()=>{}){const fails=[];if(!allVideos().length)return {fails};await gEnsureFolder();
  const pend=allVideos().filter(v=>!V.drive.videos[v.id]);let n=0;
  for(const v of pend){const vv=videoCache.get(v.id);if(!vv)continue;n++;progress(`Enviando vídeo ${n} de ${pend.length} ao Drive…`);
    const [type,ext]=driveVideoType(vv);const name=`Video_Apto_${slug(V.dados.apartamento)}_${slug(v.label.replace(/ › /g,'_'))}.${ext}`;
    try{const f=await gUpload(vv.blob,name,type,V.drive.folderId);await gShareAnyone(f.id);V.drive.videos[v.id]={id:f.id,url:f.webViewLink||`https://drive.google.com/file/d/${f.id}/view`};await saveNow()}
    catch(e){if(e.code==='need_login')throw e;fails.push(`${v.label}: ${e.message||'erro no envio'}`)}}
  return {fails}}
function gDriveBoxHTML(){const vids=allVideos();const sent=vids.filter(v=>V.drive&&V.drive.videos&&V.drive.videos[v.id]).length;const logged=!!cachedTok();
  return `<div class="area" style="gap:10px"><div class="area-h"><span style="color:var(--accent)">Google Drive</span></div>
    <small style="color:var(--muted)">${vids.length?`${sent} de ${vids.length} ${vids.length===1?'vídeo no Drive':'vídeos no Drive'}.`:'Nenhum vídeo nesta vistoria.'} Os vídeos vão para a pasta "Vistorias de Entrega" no seu Drive, com link aberto para quem receber o PDF. ${logged?'Conectado.':'Na primeira vez de cada dia, o Google pede para você entrar.'}</small>
    <button class="btn primary" id="driveBtn" ${driveBusy?'disabled':''}>${driveBusy?'Enviando…':'Enviar vídeos e PDF ao Drive'}</button>
    ${V.drive&&V.drive.folderUrl?`<a href="${esc(V.drive.folderUrl)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">Abrir a pasta desta vistoria no Drive</a>`:''}
    ${driveMsg?`<div class="note" id="driveSt">${driveMsg}</div>`:''}</div>`}
function gErr(e){if(e&&e.code==='need_login')return 'A conexão com o Google expirou. Toque em "Enviar vídeos e PDF ao Drive" de novo.';if(e&&e.status===403)return 'O Google recusou o acesso. Confira se o seu e-mail está como usuário de teste no Google Cloud.';return 'Não consegui enviar ao Drive. Verifique a internet e tente de novo.'+(e&&e.message?' ('+esc(e.message)+')':'')}
function gSendToDrive(){if(driveBusy)return;if(navigator.onLine===false){setDriveMsg('Sem internet agora. Os vídeos continuam guardados no aparelho.');return}
  gLogin(async ok=>{if(!ok){setDriveMsg('Não foi possível entrar na conta Google. Tente de novo.');return}
    driveBusy=true;setDriveMsg('Preparando a pasta no Drive…');let fails=[];

        doc.setDrawColor(...C.line);doc.line(M,y,W-M,y);y+=2;
      }
      if(skippedRest(s,sd.vals)){text('Demais itens não se aplicam.',M,9,'italic',C.muted);}
      y+=3;
    }
  }
  // Pendências
  {const dv=memoDiverg();if(dv.length){need(16);y+=4;doc.setFont('helvetica','bold');doc.setFontSize(12);col(C.bad);doc.text(`DIVERGÊNCIAS COM O MEMORIAL: ${dv.length}`,M,y+5);y+=9;dv.forEach(x=>{text(`${x.a.nome} › ${x.s.nome} › ${x.it.label}: memorial ${x.c.memo}, encontrado ${x.c.found}`,M,9.5,'normal',C.ink)});y+=2}}
  const p=pendencias();need(20);y+=4;doc.setFont('helvetica','bold');doc.setFontSize(13);col(C.ink);doc.text('RESUMO DE PENDÊNCIAS',M,y+5);y+=10;
  if(!p.length)text('Nenhum item não aprovado.',M,10,'normal',C.muted);
  p.forEach((x,i)=>{text(`${i+1}. ${x.amb} › ${x.sub} › ${x.item}`,M,10,'bold',C.bad);if(x.obs)text(x.obs,M+5,9.5,'normal',C.ink,CW-5);y+=1.5});
  if(V.obsGerais&&V.obsGerais.trim()){y+=4;text('OBSERVAÇÕES GERAIS',M,11,'bold');y+=1;text(V.obsGerais.trim(),M,10)}
  // Resultado
  need(30);y+=6;const r=V.resultado||'Não informado';const rc=r==='Aprovado'?C.ok:r==='Não aprovado'?C.bad:C.na;
  doc.setDrawColor(...rc);doc.setLineWidth(1);doc.rect(M,y,CW,20);doc.setLineWidth(0.2);
  doc.setFont('helvetica','bold');doc.setFontSize(10);col(C.muted);doc.text('RESULTADO DA VISTORIA',M+5,y+7);doc.setFontSize(18);col(rc);doc.text(r.toUpperCase(),M+5,y+16);y+=26;
  const folderLink=(V.pastaLink&&/^https?:\/\//i.test(V.pastaLink))?V.pastaLink:(V.drive&&V.drive.folderUrl);
  if(folderLink){need(14);doc.setFont('helvetica','bold');doc.setFontSize(10);col(C.ink);doc.text('Vídeos e arquivos desta vistoria no Google Drive:',M,y+4);y+=6;doc.setFont('helvetica','normal');doc.setFontSize(9.5);col(C.accent);const fl=doc.splitTextToSize(folderLink,CW);doc.text(fl,M,y+4);doc.link(M,y,CW,fl.length*4.5,{url:folderLink});y+=fl.length*4.5+4}
  // Rodapé
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);col(C.muted);
    doc.text(`Titá Soluções de Engenharia · ${d.empreendimento||''} · Apto ${d.apartamento||''} · ${fmtDate(d.data)}`,M,H-8);doc.text(`Página ${i} de ${n}`,W-M,H-8,{align:'right'})}
  const clean=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
  const name=`Vistoria_Apto_${clean(d.apartamento)||'sem'}_${clean(d.cliente)||'cliente'}_${(d.data||'').split('-').reverse().join('-')}.pdf`;
  return {blob:doc.output('blob'),name};
}
